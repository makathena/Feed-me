<style>
  :root{
    --paper:#FAF7F0; --paper-2:#F1EADA; --line:#E3D9C4;
    --ink:#262019; --ink-soft:#7C7361; --ink-faint:#A79C87;
    --accent:#1F5D66; --accent-2:#163F46; --accent-soft:#DEEAEA; --accent-ink:#F7FBFB;
    --ok:#3F7A4E; --ok-bg:#E4EFE1;
    --low:#A97417; --low-bg:#F5E9D2;
    --out:#B23D2D; --out-bg:#F6E1DC;
    --extra:#7C6A9A; --extra-bg:#EAE4F1;
    --shadow: 0 10px 30px -18px rgba(38,32,25,0.45);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1A1712; --paper-2:#241F17; --line:#3A3226;
      --ink:#F3EDE1; --ink-soft:#B7AB93; --ink-faint:#7C7361;
      --accent:#63B6BD; --accent-2:#8CD3D8; --accent-soft:#20393C; --accent-ink:#0E2426;
      --ok:#84C591; --ok-bg:#1E2E20;
      --low:#E3B15C; --low-bg:#332711;
      --out:#E38A76; --out-bg:#3A2019;
      --extra:#BDA7DA; --extra-bg:#2A2436;
      --shadow: 0 10px 30px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1A1712; --paper-2:#241F17; --line:#3A3226;
    --ink:#F3EDE1; --ink-soft:#B7AB93; --ink-faint:#7C7361;
    --accent:#63B6BD; --accent-2:#8CD3D8; --accent-soft:#20393C; --accent-ink:#0E2426;
    --ok:#84C591; --ok-bg:#1E2E20;
    --low:#E3B15C; --low-bg:#332711;
    --out:#E38A76; --out-bg:#3A2019;
    --extra:#BDA7DA; --extra-bg:#2A2436;
    --shadow: 0 10px 30px -14px rgba(0,0,0,0.6);
  }
  :root[data-theme="light"]{
    --paper:#FAF7F0; --paper-2:#F1EADA; --line:#E3D9C4;
    --ink:#262019; --ink-soft:#7C7361; --ink-faint:#A79C87;
    --accent:#1F5D66; --accent-2:#163F46; --accent-soft:#DEEAEA; --accent-ink:#F7FBFB;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  img{ max-width:100%; }
  button, input, select, textarea{ font-family:inherit; color:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  ::selection{ background:var(--accent-soft); }
  .num{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  .eyebrow{ font-family:'Public Sans',sans-serif; font-weight:700; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-soft); }
  .display{ font-family:'Fraunces',Georgia,serif; font-optical-sizing:auto; text-wrap:balance; }

  .shell{ max-width:600px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; position:relative; }

  /* ---------- header ---------- */
  header.top{
    position:sticky; top:0; z-index:20; background:var(--paper);
    border-bottom:1px solid var(--line);
    padding: max(14px, env(safe-area-inset-top)) 18px 12px;
  }
  .top-row{ display:flex; align-items:center; gap:10px; }
  .mark{ width:30px; height:30px; border-radius:9px; background:var(--accent); display:flex; align-items:center; justify-content:center; flex:none; }
  .mark svg{ width:16px; height:16px; }
  .top-title{ font-family:'Fraunces',serif; font-weight:650; font-size:19px; letter-spacing:-0.01em; }
  .sync{ margin-left:auto; display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-soft); }
  .sync .dot{ width:6px; height:6px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 3px var(--ok-bg); }
  .sync .dot.off{ background:var(--ink-faint); box-shadow:0 0 0 3px var(--paper-2); }

  /* ---------- intro banner ---------- */
  .banner{
    margin:12px 18px 0; padding:12px 14px; background:var(--accent-soft); border-radius:12px;
    display:flex; gap:10px; align-items:flex-start; font-size:12.5px; line-height:1.55; color:var(--ink);
  }
  .banner p{ margin:0; flex:1; }
  .banner button{ background:none; border:none; color:var(--accent); font-weight:600; font-size:12px; cursor:pointer; padding:2px 0; flex:none; }

  .setup-note{
    margin:16px 18px; padding:16px; background:var(--out-bg); color:var(--out); border-radius:12px; font-size:13px; line-height:1.6;
  }
  .setup-note code{ background:rgba(0,0,0,0.08); padding:1px 5px; border-radius:5px; font-family:'IBM Plex Mono',monospace; font-size:12px; }

  /* ---------- main / tabs ---------- */
  main{ flex:1; padding: 14px 18px calc(96px + env(safe-area-inset-bottom)); }
  .tab{ }
  .tab[hidden]{ display:none; }

  section.shelf{ margin-bottom:26px; }
  .shelf-head{ display:flex; align-items:baseline; gap:8px; padding-bottom:8px; border-bottom:1px solid var(--line); margin-bottom:2px; }
  .shelf-head .name{ font-family:'Fraunces',serif; font-weight:560; font-size:16.5px; }
  .shelf-head .count{ margin-left:auto; font-size:11px; color:var(--ink-faint); }

  .item-row-wrap{ position:relative; overflow:hidden; border-bottom:1px solid var(--line); }
  .item-row-wrap:last-of-type{ border-bottom:none; }
  .item-row-actions{ position:absolute; inset:0; display:flex; align-items:stretch; justify-content:flex-end; }
  .item-row-actions button{
    flex:none; width:64px; border:none; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; font-size:10px; font-weight:700; letter-spacing:0.02em; color:#fff; cursor:pointer;
  }
  .item-row-actions button svg{ width:16px; height:16px; }
  .item-row-actions .act-list{ background:var(--accent); }
  .item-row-actions .act-delete{ background:var(--out); }
  .item-row{
    position:relative; display:flex; align-items:center; gap:10px; padding:10px 2px;
    background:var(--paper); touch-action:pan-y; transform:translateX(0); transition:transform 200ms ease;
  }
  .item-row.dragging{ transition:none; }
  .item-main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; cursor:pointer; }
  .item-name{ font-size:14.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item-sub{ font-size:11px; color:var(--ink-faint); }
  .extra-flag{
    position:relative; flex:none; width:26px; height:26px; border-radius:7px; border:1px solid var(--line); background:transparent;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-faint);
  }
  .extra-flag svg{ width:14px; height:14px; }
  .extra-flag.on{ background:var(--extra-bg); border-color:transparent; color:var(--extra); }
  .extra-flag .mini-badge{
    position:absolute; top:-5px; right:-5px; width:14px; height:14px; border-radius:50%; background:var(--extra);
    color:#fff; font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .status-pill{
    flex:none; appearance:none; border:none; cursor:pointer; font-weight:700; font-size:11px; letter-spacing:0.03em;
    padding:6px 11px; border-radius:100px; text-transform:uppercase;
  }
  .status-pill.ok{ background:var(--ok-bg); color:var(--ok); }
  .status-pill.low{ background:var(--low-bg); color:var(--low); }
  .status-pill.out{ background:var(--out-bg); color:var(--out); }

  .search-row{ position:relative; margin-bottom:18px; }
  .search-row input{
    width:100%; border:1px solid var(--line); background:var(--paper-2); border-radius:11px;
    padding:11px 36px 11px 14px; font-size:14px;
  }
  .search-clear{
    position:absolute; right:6px; top:50%; transform:translateY(-50%); width:26px; height:26px; border-radius:50%;
    border:none; background:transparent; color:var(--ink-faint); font-size:17px; cursor:pointer; line-height:1;
  }
  .search-clear:hover{ color:var(--ink); }

  .add-row{ display:flex; gap:8px; padding-top:10px; }
  .add-row input{ flex:1; border:1px solid var(--line); background:var(--paper-2); border-radius:9px; padding:9px 12px; font-size:13.5px; }
  .add-row button{
    flex:none; border:none; background:var(--accent); color:var(--accent-ink); width:36px; border-radius:9px; font-size:18px; cursor:pointer; line-height:1;
  }
  .empty-note{ font-size:12.5px; color:var(--ink-faint); padding:10px 2px; }

  /* ---------- shopping tab ---------- */
  .shop-summary{ display:flex; align-items:baseline; gap:8px; margin-bottom:16px; }
  .shop-summary .copy-list-btn{ margin-left:auto; }
  .shop-summary .big{ font-family:'Fraunces',serif; font-weight:650; font-size:30px; }

function resizeImageToDataURL(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim){ height = Math.round(height * maxDim / width); width = maxDim; }
        else if (height >= width && height > maxDim){ width = Math.round(width * maxDim / height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function ensureSeeded(){
  const cfgRef = db.doc('settings/config');
  const snap = await cfgRef.get().catch(() => null);
  if (snap && snap.exists){
    const d = snap.data();
    categories = Array.isArray(d.categories) && d.categories.length ? d.categories : STARTER_CATEGORIES;
    stores = Array.isArray(d.stores) ? d.stores : STARTER_STORES;
    return;
  }
  categories = STARTER_CATEGORIES.slice();
  stores = STARTER_STORES.slice();
  await cfgRef.set({ categories, stores, introDismissed: true, seeded: true }).catch(() => {});

}

  unsubs.push(db.collection('pantry').onSnapshot(
    snap => { pantryItems = snap.docs.map(d => ({ id: d.id, ...d.data() })); setSyncState(true, 'Synced'); renderActiveTab(); },
    err => { setSyncState(false, 'Sync error'); console.error(err); }
  ));
  unsubs.push(db.collection('shopping').onSnapshot(
    snap => { shopExtras = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderActiveTab(); },
    err => console.error(err)
  ));
  unsubs.push(db.collection('priceWatches').onSnapshot(
    snap => { priceWatches = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderActiveTab(); },
    err => console.error(err)
  ));
  unsubs.push(db.doc('settings/config').onSnapshot(
    snap => { if (snap.exists){
      const d = snap.data();
      if (Array.isArray(d.categories) && d.categories.length) categories = d.categories;
      if (Array.isArray(d.stores)) stores = d.stores;
      renderActiveTab();
    } },
    err => console.error(err)
  ));
}

  root.querySelectorAll('[data-status-btn]').forEach(el => el.addEventListener('click', (e) => {

/* ---------- swipe-to-reveal actions on pantry rows ---------- */
const SWIPE_OPEN_X = -128;
let openSwipeWrap = null;

function closeSwipe(wrap){
  if (!wrap) return;
  const row = wrap.querySelector('.item-row');
  if (row) row.style.transform = 'translateX(0)';
  wrap.classList.remove('open');
  if (openSwipeWrap === wrap) openSwipeWrap = null;
}
function closeOtherSwipes(exceptWrap){
  if (openSwipeWrap && openSwipeWrap !== exceptWrap) closeSwipe(openSwipeWrap);
}

function initSwipeRows(root){
  root.querySelectorAll('.item-row-wrap').forEach(wrap => {
    const row = wrap.querySelector('.item-row');
    let startX = 0, startY = 0, baseX = 0, dragging = false, axis = null, moved = false;

    row.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      startX = e.clientX; startY = e.clientY;
      baseX = wrap.classList.contains('open') ? SWIPE_OPEN_X : 0;
      dragging = true; axis = null; moved = false;
    });
    row.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (axis === null){
        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
        if (axis === 'y'){ dragging = false; return; }
        row.classList.add('dragging');
        row.setPointerCapture(e.pointerId);
        closeOtherSwipes(wrap);
      }
      if (axis !== 'x') return;
      moved = true;
      const x = Math.max(SWIPE_OPEN_X, Math.min(0, baseX + dx));
      row.style.transform = `translateX(${x}px)`;
    });
    const end = (e) => {
      if (!dragging) return;
      dragging = false;
      row.classList.remove('dragging');
      if (axis === 'x' && moved){
        const dx = e.clientX - startX;
        const x = Math.max(SWIPE_OPEN_X, Math.min(0, baseX + dx));
        const open = x < SWIPE_OPEN_X / 2;
        row.style.transform = open ? `translateX(${SWIPE_OPEN_X}px)` : 'translateX(0)';
        wrap.classList.toggle('open', open);
        openSwipeWrap = open ? wrap : (openSwipeWrap === wrap ? null : openSwipeWrap);
      }
      axis = null;
    };
    row.addEventListener('pointerup', end);
    row.addEventListener('pointercancel', end);
  });

  root.querySelectorAll('[data-list-btn]').forEach(btn => btn.addEventListener('click', () => {
    closeSwipe(btn.closest('.item-row-wrap'));
    addToShoppingList(btn.dataset.listBtn);
  }));
  root.querySelectorAll('[data-delete-btn]').forEach(btn => btn.addEventListener('click', () => {
    closeSwipe(btn.closest('.item-row-wrap'));
    swipeDeleteItem(btn.dataset.deleteBtn);
  }));
}

async function swipeDeleteItem(id){
  const item = pantryItems.find(i => i.id === id);
  if (!item) return;
  const backupState = item.backupState || (item.extra ? 'opened' : 'none');
  const snapshot = { name: item.name, categoryId: item.categoryId, status: item.status, backupState, photoData: item.photoData || null, store: item.store, saleTag: item.saleTag, createdAt: item.createdAt };
  try {
    await db.doc('pantry/' + id).delete();
    toast(`Deleted ${item.name}`, 'Undo', async () => {
      await db.collection('pantry').add(snapshot).catch(() => toast('Could not undo'));
    });
  } catch(err){
    toast('Could not delete');
  }
}

async function addToShoppingList(id){
  const item = pantryItems.find(i => i.id === id);
  if (!item) return;
  if (item.status !== 'ok'){ toast(`${item.name} is already on your shopping list`); return; }
  const dup = shopExtras.find(e => e.name.trim().toLowerCase() === item.name.trim().toLowerCase());
  if (dup){ toast(`${item.name} is already on your shopping list`); return; }
  await db.collection('shopping').add({ name: item.name, store: item.store || null, saleTag: null, createdAt: Date.now() })
    .then(() => toast(`Added ${item.name} to shopping list`))
    .catch(() => toast('Could not add to shopping list'));
}

const CATEGORY_DEFAULT_STORE = { spices: 'Indian Store', lentils: 'Indian Store' };

async function addPantryItem(categoryId, name){
  name = (name || '').trim();
  if (!name) return;
  const store = CATEGORY_DEFAULT_STORE[categoryId] || null;
  await db.collection('pantry').add({ name, categoryId, status: 'ok', backupState: 'none', photoData: null, store, saleTag: null, createdAt: Date.now() }).catch(() => toast('Could not add item'));
}

async function cycleStatus(id){
  const item = pantryItems.find(i => i.id === id);
  if (!item) return;
  await db.doc('pantry/' + id).update({ status: STATUS_CYCLE[item.status] }).catch(() => toast('Could not update'));
}

function isHitDismissed(w){
  if (!w.dismissedAt) return false;
  if (!w.lastCheckedAt) return true;
  return w.dismissedAt >= new Date(w.lastCheckedAt).getTime();
}

async function dismissHit(id){
  await db.doc('priceWatches/' + id).update({ dismissedAt: Date.now() }).catch(() => toast('Could not dismiss'));
}

async function applyPurchaseToPantry(name){
  const match = pantryItems.find(i => i.name.trim().toLowerCase() === (name || '').trim().toLowerCase());
  if (!match) return;
  if (match.status !== 'ok'){
    await db.doc('pantry/' + match.id).update({ status: 'ok' }).catch(() => {});
    return;
  }
  const current = match.backupState || (match.extra ? 'opened' : 'none');
  const next = current === 'none' ? 'opened' : 'both';
  if (next !== current) await db.doc('pantry/' + match.id).update({ backupState: next }).catch(() => {});
}

async function cycleBackup(id){
  const item = pantryItems.find(i => i.id === id);
  if (!item) return;
  const current = item.backupState || (item.extra ? 'opened' : 'none');
  await db.doc('pantry/' + id).update({ backupState: BACKUP_CYCLE[current] }).catch(() => toast('Could not update'));
}

function saleTagText(tag){
  if (!tag) return '';
  if (tag.note) return tag.note;
  if (tag.price != null) return `On sale $${Number(tag.price).toFixed(2)}${tag.store ? ' at ' + tag.store : ''}`;
  return '';
}

function buildShoppingEntries(){
  const needed = pantryItems.filter(i => i.status !== 'ok');
  const pantryEntries = needed.map(i => ({ id: i.id, kind: 'pantry', name: i.name, store: i.store || '', status: i.status, saleTag: i.saleTag || null }));
  const extraEntries = shopExtras.map(i => ({ id: i.id, kind: 'extra', name: i.name, store: i.store || '', status: null, saleTag: i.saleTag || null }));
  return [...pantryEntries, ...extraEntries].sort((a,b) => a.name.localeCompare(b.name));
}

function shopRowHTML(e){
  const checkAttr = e.kind === 'pantry' ? `data-restock="${esc(e.id)}"` : `data-extra-done="${esc(e.id)}"`;
  const storeKey = e.kind === 'pantry' ? 'pantry' : 'extra';
  return `
    <div class="shop-row">
      <button class="check" ${checkAttr} type="button">${ICONS.check}</button>
      <div class="sbody">
        <span class="sname">${esc(e.name)}</span>
        ${e.saleTag ? `<div class="sale-tag">🏷 ${esc(saleTagText(e.saleTag))}</div>` : ''}
      </div>
      <select class="store-select" data-store-select="${storeKey}|${esc(e.id)}">
        <option value="">No store</option>
        ${stores.map(s => `<option value="${esc(s)}" ${s===e.store?'selected':''}>${esc(s)}</option>`).join('')}
      </select>
      ${e.status ? `<span class="shop-dot ${e.status}"></span>` : ''}

}

function renderShopping(){
  const root = document.getElementById('tab-shopping');

  const total = entries.length;

  const priceHits = priceWatches.filter(w => w.mode !== 'ad' && w.active !== false && w.lastPrice != null && w.lastPrice <= w.targetPrice && !isHitDismissed(w));
  const adHits = priceWatches.filter(w => w.mode === 'ad' && w.active !== false && w.adHit === true && !isHitDismissed(w));
  const hits = [...priceHits, ...adHits];

  const groups = stores.map(s => ({ store: s, items: entries.filter(e => e.store === s) })).filter(g => g.items.length);

  root.innerHTML = `
    <div class="shop-summary">

      <div class="lbl">item${total===1?'':'s'} to pick up</div>

    ${hits.length ? `<div class="hit-banner">
      ${hits.map(w => `
        <div class="hit-row">
          <span>🎉 ${w.mode === 'ad'
            ? `${esc(w.name)} is in this week's ad${w.lastStore ? ' at ' + esc(w.lastStore) : ''}${w.adDetails ? ' — ' + esc(w.adDetails) : ''}`
            : `${esc(w.name)} is $${Number(w.lastPrice).toFixed(2)}${w.lastStore ? ' at ' + esc(w.lastStore) : ''} — under your $${Number(w.targetPrice).toFixed(2)} target`}</span>

    </div>` : ''}

    ${groups.map(g => `
      <div class="shop-group-label">

      </div>
      ${g.items.map(shopRowHTML).join('')}

    <div class="manual-add">
      <input type="text" id="manualAddInput" placeholder="Add something not in the pantry…">
      <select id="manualAddStore">
        <option value="">No store</option>

    const text = groups.map(g => `${g.store || 'No store set'}\n${g.items.map(e => `• ${e.name}`).join('\n')}`).join('\n\n');

  root.querySelectorAll('[data-dismiss-hit]').forEach(btn => btn.addEventListener('click', () => {

  root.querySelectorAll('[data-restock]').forEach(btn => btn.addEventListener('click', () => {
    db.doc('pantry/' + btn.dataset.restock).update({ status: 'ok', saleTag: null }).catch(() => toast('Could not update'));

  root.querySelectorAll('[data-store-select]').forEach(sel => sel.addEventListener('change', () => {

    const coll = kind === 'pantry' ? 'pantry' : 'shopping';
    db.doc(coll + '/' + id).update({ store: sel.value || null }).catch(() => toast('Could not update store'));
  }));

  const manualGo = () => {
    const input = document.getElementById('manualAddInput');
    const storeSel = document.getElementById('manualAddStore');
    const name = input.value.trim();
    if (!name) return;
    db.collection('shopping').add({ name, store: storeSel.value || null, saleTag: null, createdAt: Date.now() }).catch(() => toast('Could not add'));
    input.value = '';
    storeSel.value = '';
    input.focus();
  };
  document.getElementById('manualAddBtn').addEventListener('click', manualGo);
  document.getElementById('manualAddInput').addEventListener('keydown', e => { if (e.key === 'Enter') manualGo(); });
}

async function copyText(text, btn){
  let ok = false;
  try{ await navigator.clipboard.writeText(text); ok = true; } catch(e){}
  if (!ok){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      ok = document.execCommand('copy');
      ta.remove();
    } catch(e){}
  }
  if (ok){
    const original = btn.textContent;
    btn.textContent = 'Copied ✓'; btn.classList.add('done');
    setTimeout(() => { btn.textContent = original; btn.classList.remove('done'); }, 1600);
  } else {
    toast('Couldn\'t copy — select the text above manually');
  }
}

/* ============================== SETTINGS TAB ============================== */
function renderSettings(){
  const root = document.getElementById('tab-settings');
  root.innerHTML = `
    <div class="set-group">
      <div class="set-title">Categories</div>
      ${categories.map((c, idx) => {
        const count = pantryItems.filter(i => i.categoryId === c.id).length;
        return `
        <div class="cat-row">
          <input type="text" data-cat-name="${esc(c.id)}" value="${esc(c.name)}">
          <span class="cnt num">${count} item${count===1?'':'s'}</span>
          <button class="icon-btn" data-cat-up="${idx}" ${idx===0?'disabled':''} title="Move up">${ICONS.up}</button>
          <button class="icon-btn" data-cat-down="${idx}" ${idx===categories.length-1?'disabled':''} title="Move down">${ICONS.down}</button>
          <button class="icon-btn" data-cat-del="${esc(c.id)}" ${count>0?'disabled':''} title="${count>0?'Move or delete its items first':'Delete category'}">${ICONS.trash}</button>
        </div>`;
      }).join('')}
      <div class="add-row" style="margin-top:8px;">
        <input type="text" id="newCatName" placeholder="Add a category…">
        <button type="button" id="newCatBtn">+</button>
      </div>
    </div>

    <div class="set-group">
      <div class="set-title">Stores</div>
      <p class="set-hint">Used to split the shopping list by where you'll buy each item.</p>
      ${stores.map((s, idx) => `
        <div class="store-row">
          <input type="text" data-store-name="${idx}" value="${esc(s)}">
          <button class="icon-btn" data-store-up="${idx}" ${idx===0?'disabled':''} title="Move up">${ICONS.up}</button>
          <button class="icon-btn" data-store-down="${idx}" ${idx===stores.length-1?'disabled':''} title="Move down">${ICONS.down}</button>
          <button class="icon-btn" data-store-del="${idx}" title="Remove store">${ICONS.trash}</button>
        </div>`).join('')}
      <div class="add-row" style="margin-top:8px;">
        <input type="text" id="newStoreName" placeholder="Add a store…">
        <button type="button" id="newStoreBtn">+</button>
      </div>
    </div>

    <div class="set-group">
      <div class="set-title">Price watches</div>
      <p class="set-hint">A daily cloud check tracks prices or watches for weekly-ad appearances on the items below, and emails you when something hits. Best-effort — coverage depends on what each store publishes online.</p>
      ${priceWatches.length === 0 ? '<div class="empty-note">No price watches yet.</div>' : priceWatches.map(w => {
        const isAd = w.mode === 'ad';
        return `
        <div class="watch-row">
          <div class="wtop">
            <span class="wname">${esc(w.name)}</span>
            <span class="wtarget num">${isAd ? 'weekly ad' : 'under $' + Number(w.targetPrice).toFixed(2)}</span>
            <button class="icon-btn" data-watch-del="${esc(w.id)}" title="Remove watch">${ICONS.trash}</button>
          </div>
          <div class="wstores">Checking: ${esc((w.stores || []).join(', ') || '—')}</div>
          <div class="wfound ${isAd ? (w.adHit ? 'hit' : '') : (w.lastPrice != null && w.lastPrice <= w.targetPrice ? 'hit' : '')}">
            ${isAd
              ? (w.lastCheckedAt ? (w.adHit ? `In this week's ad${w.adDetails ? ': ' + esc(w.adDetails) : ''} · ${new Date(w.lastCheckedAt).toLocaleDateString()}` : `Not in this week's ad · ${new Date(w.lastCheckedAt).toLocaleDateString()}`) : 'Not checked yet')
              : (w.lastCheckedAt ? `Last found: $${Number(w.lastPrice).toFixed(2)}${w.lastStore ? ' at ' + esc(w.lastStore) : ''} · ${new Date(w.lastCheckedAt).toLocaleDateString()}` : 'Not checked yet')}
          </div>
        </div>`;
      }).join('')}
      <div class="watch-add">
        <div class="watch-mode-toggle">
          <button type="button" class="wmode-btn ${watchAddMode === 'price' ? 'active' : ''}" data-wmode="price">Track a price</button>
          <button type="button" class="wmode-btn ${watchAddMode === 'ad' ? 'active' : ''}" data-wmode="ad">Watch weekly ads</button>
        </div>
        <input type="text" id="watchName" placeholder="Item name (be specific — brand, size)">
        <div class="watch-add-row">
          ${watchAddMode === 'price' ? '<input type="number" class="tp" id="watchPrice" placeholder="Target $" step="0.01" min="0">' : ''}
          <input type="text" id="watchStores" placeholder="Stores to check, comma-separated">
        </div>
        <button type="button" class="btn-copy" id="addWatchBtn" style="align-self:flex-start;">${watchAddMode === 'price' ? 'Add price watch' : 'Add ad watch'}</button>
      </div>
    </div>

  `;

  root.querySelectorAll('[data-cat-name]').forEach(inp => {
    inp.addEventListener('change', () => {
      const id = inp.dataset.catName;
      const next = categories.map(c => c.id === id ? { ...c, name: inp.value.trim() || c.name } : c);
      db.doc('settings/config').update({ categories: next }).catch(() => toast('Could not rename'));
    });
  });
  root.querySelectorAll('[data-cat-up]').forEach(btn => btn.addEventListener('click', () => moveCategory(+btn.dataset.catUp, -1)));
  root.querySelectorAll('[data-cat-down]').forEach(btn => btn.addEventListener('click', () => moveCategory(+btn.dataset.catDown, 1)));
  root.querySelectorAll('[data-cat-del]').forEach(btn => btn.addEventListener('click', () => deleteCategory(btn.dataset.catDel)));
  document.getElementById('newCatBtn').addEventListener('click', () => addCategory('newCatName'));
  document.getElementById('newCatName').addEventListener('keydown', e => { if (e.key === 'Enter') addCategory('newCatName'); });

  root.querySelectorAll('[data-store-name]').forEach(inp => {
    inp.addEventListener('change', () => renameStore(+inp.dataset.storeName, inp.value));
  });
  root.querySelectorAll('[data-store-up]').forEach(btn => btn.addEventListener('click', () => moveStore(+btn.dataset.storeUp, -1)));
  root.querySelectorAll('[data-store-down]').forEach(btn => btn.addEventListener('click', () => moveStore(+btn.dataset.storeDown, 1)));
  root.querySelectorAll('[data-store-del]').forEach(btn => btn.addEventListener('click', () => deleteStore(+btn.dataset.storeDel)));
  document.getElementById('newStoreBtn').addEventListener('click', addStore);
  document.getElementById('newStoreName').addEventListener('keydown', e => { if (e.key === 'Enter') addStore(); });

  root.querySelectorAll('[data-wmode]').forEach(btn => btn.addEventListener('click', () => {
    watchAddMode = btn.dataset.wmode;
    renderSettings();
  }));
  document.getElementById('addWatchBtn').addEventListener('click', addPriceWatch);
  root.querySelectorAll('[data-watch-del]').forEach(btn => btn.addEventListener('click', () => {
    db.doc('priceWatches/' + btn.dataset.watchDel).delete().catch(() => toast('Could not remove watch'));
  }));
}

function moveCategory(idx, dir){
  const next = categories.slice();
  const j = idx + dir;
  if (j < 0 || j >= next.length) return;
  [next[idx], next[j]] = [next[j], next[idx]];
  db.doc('settings/config').update({ categories: next }).catch(() => toast('Could not reorder'));
}

function addCategory(inputId){
  const input = document.getElementById(inputId);
  if (!input) return;
  const name = input.value.trim();
  if (!name) return;
  const id = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || ('cat-' + Date.now());
  if (categories.some(c => c.id === id)){ toast('That category already exists'); return; }
  const next = [...categories, { id, name }];
  db.doc('settings/config').update({ categories: next }).catch(() => toast('Could not add category'));
  input.value = '';
  toast(`Added "${name}"`);
}

function deleteCategory(id){
  const next = categories.filter(c => c.id !== id);
  db.doc('settings/config').update({ categories: next }).catch(() => toast('Could not delete category'));
}

function moveStore(idx, dir){
  const next = stores.slice();
  const j = idx + dir;
  if (j < 0 || j >= next.length) return;
  [next[idx], next[j]] = [next[j], next[idx]];
  db.doc('settings/config').update({ stores: next }).catch(() => toast('Could not reorder'));
}

function renameStore(idx, value){
  const name = value.trim();
  if (!name) return;
  const next = stores.slice();
  next[idx] = name;
  db.doc('settings/config').update({ stores: next }).catch(() => toast('Could not rename store'));
}

function addStore(){
  const input = document.getElementById('newStoreName');
  const name = input.value.trim();
  if (!name) return;
  if (stores.includes(name)){ toast('That store is already in the list'); return; }
  db.doc('settings/config').update({ stores: [...stores, name] }).catch(() => toast('Could not add store'));
  input.value = '';
}

function deleteStore(idx){
  const next = stores.filter((_, i) => i !== idx);
  db.doc('settings/config').update({ stores: next }).catch(() => toast('Could not remove store'));
}

function addPriceWatch(){
  const name = document.getElementById('watchName').value.trim();
  const storesStr = document.getElementById('watchStores').value.trim();
  if (!name){ toast('Give the item a name'); return; }
  const watchStores = storesStr ? storesStr.split(',').map(s => s.trim()).filter(Boolean) : [];
  if (watchAddMode === 'ad'){
    db.collection('priceWatches').add({
      mode: 'ad', name, targetPrice: null, stores: watchStores, adHit: false, adDetails: null, lastCheckedAt: null,
      notifyEmail: 'athenamak@gmail.com', active: true, createdAt: Date.now(),
    }).catch(() => toast('Could not add ad watch'));
  } else {
    const price = parseFloat(document.getElementById('watchPrice').value);
    if (!(price > 0)){ toast('Enter a target price'); return; }
    db.collection('priceWatches').add({
      mode: 'price', name, targetPrice: price, stores: watchStores, lastPrice: null, lastStore: null, lastCheckedAt: null,
      notifyEmail: 'athenamak@gmail.com', active: true, createdAt: Date.now(),
    }).catch(() => toast('Could not add price watch'));
  }
  document.getElementById('watchName').value = '';
  const priceInput = document.getElementById('watchPrice');
  if (priceInput) priceInput.value = '';
  document.getElementById('watchStores').value = '';
}

/* ============================== BOOT ============================== */
init();
</script>
